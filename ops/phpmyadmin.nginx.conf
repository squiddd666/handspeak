# Include inside the HTTPS server block. Requires nginx http_auth_request_module.
location = /_database_authorize {
    internal;
    proxy_pass http://127.0.0.1:8000/api/admin/database-access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /phpmyadmin { return 301 /phpmyadmin/; }
location ^~ /phpmyadmin/ {
    alias /usr/share/phpmyadmin/;
    index index.php;
    auth_request /_database_authorize;
    error_page 401 =302 /?signin=1;
    client_max_body_size 34m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    location ~ ^/phpmyadmin/(?:setup|libraries|templates|vendor|sql|doc)/ { return 404; }
    location ~ ^/phpmyadmin/(?:config[^/]*|composer\..*)$ { return 404; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
}
